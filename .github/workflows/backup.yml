# TEMPLATE — not yet active. This workflow only runs once BOTH of the
# following are true: (1) it has been reviewed and committed to the
# repository's default branch, and (2) every secret it references below has
# been added under Settings -> Secrets and variables -> Actions. Until then
# it does nothing — GitHub Actions does not schedule workflows that live
# only in a local working tree, and a `schedule:` trigger never fires from
# any branch other than the default one. Do not read this file's presence
# as "backups are running" — see docs/backups.md for what is and isn't
# active.
#
# What this does once enabled: once daily, dumps the production PostgreSQL
# database with the read-only stranger_club_backup role (see
# scripts/provision_database_roles.sql — this workflow must never be given
# the application or migrator credential), uploads the compressed dump to
# the backups/postgres/ prefix of object storage using a credential scoped
# ONLY to that prefix, and fails the workflow (which GitHub will surface as
# a red run + can be wired to notifications) if the dump is missing or
# suspiciously small.

name: Scheduled backup

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily — adjust to your traffic's quiet hours
  workflow_dispatch: {}  # allows a manual "run now" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          # A stranger_club_backup-role connection string — read-only, see
          # docs/database.md. Never the application or migrator credential.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          FILENAME="stranger-club-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"
          pg_dump --dbname="$BACKUP_DATABASE_URL" -Fc -f "$FILENAME"
          SIZE=$(stat -c%s "$FILENAME" 2>/dev/null || stat -f%z "$FILENAME")
          echo "Dump size: $SIZE bytes"
          # A near-empty backup is worse than no backup — it creates false
          # confidence. Tune this floor to what a genuinely empty schema
          # dumps to on your database, plus margin.
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::Backup file is suspiciously small ($SIZE bytes) — failing rather than uploading a false sense of security."
            exit 1
          fi
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload to object storage
        env:
          # A credential scoped ONLY to the backups/ prefix — distinct from
          # both the application's SC_STORAGE_* runtime credential and the
          # storage-admin credential used for reconciliation, and (like the
          # app credential) must not have delete permission on this prefix
          # either — retention/expiry is a lifecycle-policy or manual
          # decision, never something a routine backup run can perform.
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          pip install boto3
          python - <<EOF
          import os
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["BACKUP_STORAGE_ENDPOINT_URL"],
              region_name=os.environ.get("BACKUP_STORAGE_REGION", "auto"),
          )
          filename = os.environ["FILENAME"]
          client.upload_file(filename, os.environ["BACKUP_STORAGE_BUCKET"], f"backups/postgres/{filename}")
          print(f"Uploaded backups/postgres/{filename}")
          EOF
        # BACKUP_STORAGE_ENDPOINT_URL / BACKUP_STORAGE_BUCKET / BACKUP_STORAGE_REGION
        # can be plain (non-secret) repository variables rather than secrets
        # if you prefer — only the credentials themselves need to be secret.

      - name: Verify the upload is retrievable
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          python - <<EOF
          import os
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["BACKUP_STORAGE_ENDPOINT_URL"],
              region_name=os.environ.get("BACKUP_STORAGE_REGION", "auto"),
          )
          key = f"backups/postgres/{os.environ['FILENAME']}"
          head = client.head_object(Bucket=os.environ["BACKUP_STORAGE_BUCKET"], Key=key)
          print(f"Confirmed present: {key} ({head['ContentLength']} bytes)")
          EOF
      # A failed run at any step above surfaces as a red GitHub Actions run.
      # Wire repository notification settings (or a status-check webhook) to
      # alert on workflow failure — this file does not itself send an alert
      # anywhere; "the workflow going red" is the signal, and someone must
      # be watching for it.
