name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests (SQLite — fast feedback)
        run: pytest -q

      - name: Dependency audit (informational)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  # Authoritative: this is what production actually runs on. Every
  # PostgreSQL-specific behaviour (row locking, LISTEN/NOTIFY, JSONB, the
  # 0000 bootstrap migration) is only genuinely exercised here.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sc_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: stranger_club_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sc_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A real S3-compatible endpoint, fully local to the runner — never
      # production infrastructure. Started as a plain container (not a
      # `services:` entry) so its command can be set explicitly — the
      # official minio/minio image requires `server /data`, which the
      # declarative `services:` block has no way to supply.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci_storage_admin -e MINIO_ROOT_PASSWORD=ci_storage_admin_password \
            minio/minio server /data
          for i in $(seq 1 15); do
            if curl -sf http://localhost:9000/minio/health/live; then break; fi
            sleep 2
          done

      - name: Create MinIO bucket
        run: |
          python -m pip install boto3
          python - <<'EOF'
          import boto3
          client = boto3.client(
              "s3", endpoint_url="http://localhost:9000",
              aws_access_key_id="ci_storage_admin", aws_secret_access_key="ci_storage_admin_password",
              region_name="us-east-1",
          )
          client.create_bucket(Bucket="stranger-club-ci")
          EOF

      - name: Run tests (PostgreSQL + MinIO — authoritative)
        env:
          SC_TEST_DATABASE_URL: postgresql+psycopg://sc_app:ci_password@localhost:5432/stranger_club_ci
          SC_TEST_S3_BUCKET: stranger-club-ci
          SC_TEST_S3_ENDPOINT_URL: http://localhost:9000
          SC_TEST_S3_ACCESS_KEY_ID: ci_storage_admin
          SC_TEST_S3_SECRET_ACCESS_KEY: ci_storage_admin_password
        run: pytest -q

      - name: Migration matrix (fresh PostgreSQL bootstrap)
        env:
          DATABASE_URL: postgresql+psycopg://sc_app:ci_password@localhost:5432/stranger_club_ci
          SC_ADMIN_PASSWORD: ci-migration-check
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://sc_app:ci_password@localhost:5432/stranger_club_ci")
          with engine.begin() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
          EOF
          python -m backend.app.migrate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t stranger-club-ci .

      - name: Run container and verify /health
        run: |
          docker run -d --name sc-ci-runtime -p 8000:8000 -e SC_ADMIN_PASSWORD=ci-runtime-check stranger-club-ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker inspect --format '{{json .State.Health.Status}}' sc-ci-runtime
